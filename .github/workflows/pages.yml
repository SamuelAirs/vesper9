# Publishes the standalone simulator to GitHub Pages so it can be played on a
# phone, tablet, Steam Deck or any browser. It is the simulator only: no node,
# no Pi, and saves stay in each browser. Turn on Pages once with
# Settings > Pages > Source: GitHub Actions.
name: Publish simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the standalone simulator
        run: python3 scripts/build-demo.py
      - name: Prepare the site
        run: |
          mkdir -p _site
          # Let iOS open it full screen from the home screen; the built copy only.
          sed 's|<meta charset="utf-8" />|<meta charset="utf-8" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-title" content="VESPER-9" />|' \
            VESPER-9-Simulator.html > _site/index.html
          grep -q 'apple-mobile-web-app-capable' _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
