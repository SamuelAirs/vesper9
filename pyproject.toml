[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-nine"
version = "0.2.0"
description = "An alternate-past, single-button console for Raspberry Pi and ESP32-S3"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "pyserial>=3.5,<4"]

[project.optional-dependencies]
speech = ["vosk==0.3.45"]
# Optional more accurate dictation (second pass over each finished utterance); needs the model from scripts/get-voice-model.py
refine = ["sherpa-onnx==1.13.8", "numpy==2.5.3"]
# Optional offline encyclopedia (a Kiwix ZIM file; see scripts/get-encyclopedia.py)
encyclopedia = ["libzim>=3.4,<4"]

[project.scripts]
vesper = "vesper.server:main"

[tool.setuptools]
packages = ["vesper"]

[tool.setuptools.package-data]
vesper = ["catalog.json"]
