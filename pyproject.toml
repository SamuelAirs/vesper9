[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-nine"
version = "0.2.0"
description = "An alternate-past, single-button console for Raspberry Pi and ESP32-S3"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "pyserial>=3.5,<4"]

[project.optional-dependencies]
speech = ["vosk==0.3.45"]

[project.scripts]
vesper = "vesper.server:main"

[tool.setuptools]
packages = ["vesper"]

[tool.setuptools.package-data]
vesper = ["catalog.json"]
